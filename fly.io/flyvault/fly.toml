app = "flyvault"
kill_signal = "SIGINT"
kill_timeout = 5
primary_region = "sin"
swap_size_mb = 512

[experimental]
  auto_rollback = true

[build]
  dockerfile = "Dockerfile"

[build.args]
  DOMAIN = "vault.vijayakumar.xyz"

[mounts]
  source = "vw_data"
  destination = "/data"
  snapshot_retention = 60

[services]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
