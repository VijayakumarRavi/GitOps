# fly.toml app configuration file generated for gatusfly on 2023-08-01T12:28:26+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gatusfly'
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"

[env]
  PORT="8080"
  TZ="Asia/Kolkata"
  GATUS_LOG_LEVEL="INFO"
  GATUS_CONFIG_PATH="/config"
  GATUS_DELAY_START_SECONDS="5"

[services]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "60s"
