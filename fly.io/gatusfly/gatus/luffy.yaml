---
luffy-default-endpoint: &luffy-defaults
  group: luffy
  interval: 1m
  client:
    timeout: 30s
  conditions: ["[STATUS] < 300", "[CERTIFICATE_EXPIRATION] > 48h"]
  alerts:
    - type: pushover
endpoints:
  - name: Alert manager
    url: https://alertmanager.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Authentik
    url: https://auth.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Prometheus
    url: https://prometheus.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Grafana
    url: https://grafana.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Immich
    url: https://immich.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Bazarr
    url: https://bazarr.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Qbittorrent
    url: https://torrent.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Sabnzbd
    url: https://sabnzbd.luffy.${LAB_DOMAIN}
    <<: *luffy-defaults
  - name: Prowlarr
    url: https://prowlarr.luffy.${LAB_DOMAIN}
