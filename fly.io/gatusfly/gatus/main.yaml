---
ui:
  header: Vijay's lab
  link: https://status.${LAB_DOMAIN}
  logo: https://pnganime.com/web/image-thumbnails/82/504-md.png
alerting:
  pushover:
    application-token: ${PUSHOVER_APPLICATION_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    priority: 1
    default-alert:
      send-on-resolved: true
      failure-threshold: 5
      success-threshold: 5
disable-monitoring-lock: true
# security:
#   oidc:
#     issuer-url: ${OIDC_ISSUER_URL}
#     client-id: ${OIDC_CLIENT_ID}
#     client-secret: ${OIDC_CLIENT_SECRET}
#     redirect-url: https://status.${LAB_DOMAIN}/authorization-code/callback
#     scopes: [openid]
metrics: true
storage:
  type: sqlite
  path: /data/data.db
endpoints:
  - name: Blog
    group: core
    url: https://${MAIN_DOMAIN}
    interval: 1m
    conditions: ["[STATUS] < 300", "[CERTIFICATE_EXPIRATION] > 48h"]
    alerts:
      - type: pushover
  - name: bin.${LAB_DOMAIN}
    group: core
    url: https://bin.${LAB_DOMAIN}
    interval: 1m
    conditions: ["[STATUS] < 300", "[CERTIFICATE_EXPIRATION] > 48h"]
    alerts:
      - type: pushover
  - name: healthchecks.io
    group: core
    url: https://hc-ping.com/${HC_PING_UUID}
    interval: 30m
    conditions: ["[STATUS] < 300", "[CERTIFICATE_EXPIRATION] > 48h"]
    alerts:
      - type: pushover
