---
ui:
  header: Vijay's lab
  link: https://gatusfly.fly.dev
  logo: https://s3.vijayakumar.xyz/luffy.png
alerting:
  pushover:
    application-token: ${PUSHOVER_APPLICATION_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    priority: 1
    default-alert:
      send-on-resolved: true
      failure-threshold: 5
      success-threshold: 5
disable-monitoring-lock: true
security:
  oidc:
    issuer-url: ${OIDC_ISSUER_URL}
    client-id: ${OIDC_CLIENT_ID}
    client-secret: ${OIDC_CLIENT_SECRET}
    redirect-url: https://gatusfly.fly.dev/authorization-code/callback
    scopes: [openid]
metrics: true
storage:
  type: postgres
  caching: true
  path: ${DATABASE_URL}
endpoints:
  - name: Blog
    group: core
    url: https://vijayakumar.xyz
    interval: 1m
    conditions: ['[STATUS] < 300', '[CERTIFICATE_EXPIRATION] > 48h']
    alerts:
      - type: pushover
  - name: bin.vijayakumar.xyz
    group: core
    url: https://bin.vijayakumar.xyz
    interval: 1m
    conditions: ['[STATUS] < 300', '[CERTIFICATE_EXPIRATION] > 48h']
    alerts:
      - type: pushover
