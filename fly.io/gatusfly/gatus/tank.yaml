---
tank-default-endpoint: &tank-defaults
  group: Tank
  interval: 1m
  client:
    timeout: 30s
  conditions: ["[STATUS] < 300", "[CERTIFICATE_EXPIRATION] > 48h"]
  alerts:
    - type: pushover
endpoints:
  - name: Truenas
    url: https://tank.home.${LAB_DOMAIN}
    <<: *tank-defaults
  - name: Backrest backup
    url: https://backrest.tank.home.${LAB_DOMAIN}
    <<: *tank-defaults
  - name: Tank browser
    url: https://files.tank.home.${LAB_DOMAIN}
    <<: *tank-defaults
