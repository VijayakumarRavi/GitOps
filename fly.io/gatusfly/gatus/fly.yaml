---
fly-default-endpoint: &fly-defaults
  group: Fly.io
  interval: 1m
  client:
    timeout: 30s
  conditions: ['[STATUS] < 300', '[CERTIFICATE_EXPIRATION] > 48h']
  alerts:
    - type: pushover
endpoints:
  - name: Fly vault dns
    url: https://vault.${LAB_DOMAIN}
    <<: *fly-defaults
  - name: Fly guard
    url: https://dns.${LAB_DOMAIN}
    <<: *fly-defaults
