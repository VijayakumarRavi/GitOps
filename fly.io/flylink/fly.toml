# fly.toml app configuration file generated for flylink on 2025-01-01T00:31:33+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flylink'
primary_region = 'ams'
kill_signal = "SIGINT"
kill_timeout = "5s"
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"

[env]
  LD_SERVER_PORT = "8080"
  LD_SERVER_HOST="0.0.0.0"
  LITESTREAM_BUCKET="litestream"
  LITESTREAM_PATH="flylink"
  LITESTREAM_REGION="us-east-1"

[services]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = 'shared-cpu-1x'
