# fly.toml app configuration file generated for atticfly on 2026-06-14T14:45:31+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'atticfly'
primary_region = 'sin'
kill_signal = 'SIGINT'
kill_timeout = '5s'
swap_size_mb = 1024

[build]
dockerfile = 'Dockerfile'

[env]
TZ = 'Asia/Kolkata'

[[mounts]]
source = 'attic_data'
destination = '/data'
snapshot_retention = 60

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[services.ports]]
handlers = ["http"]
port = 8080
force_https = true

[services.concurrency]
type = 'connections'
hard_limit = 1000
soft_limit = 1000

[[vm]]
cpu_kind = 'shared'
cpus = 2
memory_mb = 512
