# fly.toml app configuration file generated for flytailexit on 2023-08-01T16:40:32+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flyguard'
primary_region = 'nrt'
kill_signal = "SIGINT"
kill_timeout = "5s"
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "41641"
  PING_HOST = "sanji"

[[services]]
  protocol = "udp"
  internal_port = 443
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 443
  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[mounts]
  source = "guard_data"
  destination = "/data"
  snapshot_retention = 60

