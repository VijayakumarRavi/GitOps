# fly.toml app configuration file generated for flytailexit on 2023-08-01T16:40:32+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flyguard'
primary_region = 'nrt'
kill_signal = "SIGINT"
kill_timeout = "5s"
swap_size_mb = 1024

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "41641"
  PING_HOST = "sanji"

[mounts]
  source = "guard_data"
  destination = "/data"
  snapshot_retention = 60

[[services]]
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 3000
  [[services.ports]]
    port = 443
  [[services.ports]]
    port = 853

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
