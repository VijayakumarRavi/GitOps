# fly.toml app configuration file generated for baovault on 2025-07-11T11:23:20+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'baovault'
primary_region = 'sin'
kill_signal = 'SIGINT'
kill_timeout = '30s'
swap_size_mb = 1024
deploy = { strategy = 'rolling', max_unavailable = 1 }

[build]
dockerfile = 'Dockerfile'

[http_service]
internal_port = 8200
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[vm]]
size = 'shared-cpu-1x'
