---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  wait: true
  force: true
  timeout: 600
  waitForJobs: true
  recreatePods: true
  cleanupOnFail: true

repositories:
  - name: cilium
    url: https://helm.cilium.io

releases:
  - name: prometheus-operator-crds
    namespace: monitoring
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 24.0.1

  - name: cilium
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/cilium
    version: 1.18.3
    values:
      - templates/values.yaml.gotmpl
    hooks:
      - # Wait for Cilium CRDs to be available
        command: bash
        args:
          - -c
          - until kubectl get crd ciliumloadbalancerippools.cilium.io ciliumbgpadvertisements.cilium.io ciliumbgppeerconfigs.cilium.io ciliumbgpclusterconfigs.cilium.io &>/dev/null; do sleep 5; done
        events:
          - postsync
        showlogs: true
      - # Apply cilium network configuration
        command: kubectl
        args:
          - apply
          - --namespace=network
          - --server-side
          - --field-manager=kustomize-controller
          - --kustomize
          - ../../apps/network/cilium/config
        events:
          - postsync
        showlogs: true
    needs:
      - monitoring/prometheus-operator-crds

  - name: coredns
    namespace: network
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.45.0
    values:
      - templates/values.yaml.gotmpl
    needs:
      - network/cilium

  - name: spegel
    namespace: system
    chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    version: 0.4.0
    values:
      - templates/values.yaml.gotmpl
    needs:
      - network/coredns

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.33.0
    values:
      - templates/values.yaml.gotmpl
    needs:
      - system/spegel

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.33.0
    wait: false
    values:
      - templates/values.yaml.gotmpl
    needs:
      - flux-system/flux-operator
