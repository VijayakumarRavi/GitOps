  name: immich-redis
  namespace: immich
  labels:
    app: immich-redis
    app.kubernetes.io/instance: immich-redis
    app.kubernetes.io/name: immich-redis
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
