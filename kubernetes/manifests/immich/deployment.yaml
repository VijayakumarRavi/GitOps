    app.kubernetes.io/name: immich-postgres
spec:
  selector:
    app: immich-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
  clusterIP: 10.43.150.104

# Redis Deployment
---
