# PostgreSQL Deployment
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app: immich-postgres
    app.kubernetes.io/instance: immich-postgres
    app.kubernetes.io/name: immich-postgres
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: immich-postgres
          image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
          envFrom:
            - secretRef:
                name: immich-postgres-env
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          lifecycle:
            preStop:
              exec:
                command:
                  - "/usr/local/bin/pg_ctl"
                  - "stop"
                  - "-D"
                  - "/var/lib/postgresql/data -w -t 60 -m fast"
          readinessProbe:
            exec:
              command:
                - "pg_isready"
                - "--dbname=${POSTGRES_DB}"
          livenessProbe:
            exec:
              command:
                - "pg_isready"
                - "--dbname=${POSTGRES_DB}"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: pvc-postgres-data

# Service
---
kind: Service
apiVersion: v1
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app: immich-postgres
