# immich-server Deployment
kind: Deployment
apiVersion: apps/v1
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: immich
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              gpu.intel.com/i915: "1"
              cpu: 4000m
            requests:
              cpu: 200m
          ports:
            - containerPort: 2283
          volumeMounts:
            - name: upload-location
              mountPath: /usr/src/app/upload
              subPath: immich-library
          # env:
          #   - name: IMMICH_WORKERS_INCLUDE
          #     value: 'api'
          envFrom:
            - secretRef:
                name: immich-server-env
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 300
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 300
            periodSeconds: 10
      volumes:
        - name: upload-location
          persistentVolumeClaim:
            claimName: pvc-immich

# Service
---
kind: Service
apiVersion: v1
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: immich
spec:
  selector:
    app: immich-server
  ports:
    - protocol: TCP
      port: 2283
      targetPort: 2283
  type: ClusterIP
  clusterIP: 10.43.150.101

