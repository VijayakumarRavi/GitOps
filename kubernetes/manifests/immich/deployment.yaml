# Immich ingress
---
kind: IngressRoute
apiVersion: traefik.io/v1alpha1
metadata:
  name: immich-server
  namespace: immich
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.home.vijayakumar.xyz`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
      middlewares:
        - name: default-headers
  tls:
    secretName: home-vijayakumar-xyz
