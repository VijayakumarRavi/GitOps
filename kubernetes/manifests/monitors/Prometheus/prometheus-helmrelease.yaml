apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitors
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: prometheus-community
  namespace: monitors
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 65.3.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitors
      valuesFiles:
        - values.yaml
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
