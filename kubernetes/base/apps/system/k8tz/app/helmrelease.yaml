---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  chart:
    spec:
      chart: k8tz
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: k8tz
        namespace: flux-system
      version: 0.20.0
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              $patch: delete
              apiVersion: v1
              kind: Namespace
              metadata:
                name: not-used
            target:
              kind: Namespace
              version: v1
  values:
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8tz
              topologyKey: kubernetes.io/hostname

            weight: 1
    cronJobTimeZone: true

    namespace: system

    replicaCount: 1

    timezone: Asia/Kolkata
    webhook:
      certManager:
        enabled: true
        issuerRef:
          kind: Issuer

          name: k8tz-webhook-selfsign
