# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chart:
    spec:
      chart: volsync
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
      version: 0.15.0
  interval: 30m
  values:
    manageCRDs: true
    metrics:
      disableAuth: true
