---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname kopiur
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kopiur
      namespace: system
  interval: 1h
  path: "./kubernetes/base/apps/system/kopiur/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: system
  timeout: 10m
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname kopiur-repository
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  dependsOn:
    - name: kopiur
    - name: external-secrets-stores
  interval: 1h
  path: "./kubernetes/base/apps/system/kopiur/repository"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: system
  timeout: 10m
  wait: true
