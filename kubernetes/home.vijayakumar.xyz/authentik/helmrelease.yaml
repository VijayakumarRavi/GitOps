apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      version: 2024.10.0
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      envFrom:
        - secretRef:
          name: authentik-secrets
    server:
      ingress:
        enabled: true
        hosts:
          - auth.home.vijayakumar.xyz
        ingressClassName: traefik-external
        tls:
          - hosts:
              - auth.home.vijayakumar.xyz
        secretName: home-vijayakumar-xyz
    postgresql:
      enabled: true
    redis:
      enabled: true
      master:
        persistence:
          size: 1Gi
