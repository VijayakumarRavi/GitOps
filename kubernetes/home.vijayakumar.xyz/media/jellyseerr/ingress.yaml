---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`jellyseerr.home.vijayakumar.xyz`)
      kind: Rule
      services:
        - name: jellyseerr
          port: 5055
      middlewares:
        - name: default-headers
  tls:
    secretName: home-vijayakumar-xyz
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyseerr
  namespace: media
  annotations:
    tailscale.com/funnel: 'true'
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [jellyseerr]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyseerr
                port:
                  number: 5055
