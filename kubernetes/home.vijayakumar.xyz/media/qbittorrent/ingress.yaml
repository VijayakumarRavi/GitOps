---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints: [websecure]
  tls:
    secretName: home-vijayakumar-xyz
  routes:
    - match: Host(`qbittorrent.home.vijayakumar.xyz`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8080
      middlewares:
        - name: default-headers
