---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/name: qbittorrent
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
    spec:
      containers:
        - image: linuxserver/qbittorrent:20.04.1
          imagePullPolicy: IfNotPresent
          name: qbittorrent
          ports:
            - containerPort: 8080
              name: web-tcp
              protocol: TCP
            - containerPort: 8080
              name: web-udp
              protocol: UDP
            - containerPort: 6881
              name: torrent-tcp
              protocol: TCP
            - containerPort: 6881
              name: torrent-udp
              protocol: UDP
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: TORRENTING_PORT
              value: '6881'
            - name: UMASK
              value: '002'
            - name: WEBUI_PORTS
              value: 8080/tcp,8080/udp
          volumeMounts:
            - mountPath: /config
              name: qbittorrent
              subPath: qbittorrent-config
            - mountPath: /media
              readOnly: false
              name: nfs
      volumes:
        - name: qbittorrent
          persistentVolumeClaim:
            claimName: qbittorrent-pvc
        - name: nfs
          persistentVolumeClaim:
            claimName: media-share-pvc
