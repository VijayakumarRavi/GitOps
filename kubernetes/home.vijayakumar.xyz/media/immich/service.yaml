---
# Immich Server
kind: Service
apiVersion: v1
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: immich
spec:
  selector:
    app: immich-server
  ports:
    - protocol: TCP
      port: 2283
      targetPort: 2283
  type: ClusterIP
  clusterIP: 10.43.150.101
---
# immich Machine Learning
kind: Service
apiVersion: v1
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app: immich-machine-learning
    app.kubernetes.io/instance: immich-machine-learning
    app.kubernetes.io/name: immich-machine-learning
spec:
  selector:
    app: immich-machine-learning
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  type: ClusterIP
  clusterIP: 10.43.150.102
---
# Redis
kind: Service
apiVersion: v1
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app: immich-redis
    app.kubernetes.io/instance: immich-redis
    app.kubernetes.io/name: immich-redis
spec:
  selector:
    app: immich-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
  clusterIP: 10.43.150.103
