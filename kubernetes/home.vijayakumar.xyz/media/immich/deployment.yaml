---
# immich-server
kind: Deployment
apiVersion: apps/v1
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: immich
spec:
  replicas: 2
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 50%
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: immich-server
              topologyKey: kubernetes.io/hostname
      dnsPolicy: ClusterFirst
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v1.123.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              gpu.intel.com/i915: '1'
              cpu: 3000m
            requests:
              cpu: 200m
          ports:
            - containerPort: 2283
          volumeMounts:
            - name: upload-location
              mountPath: /usr/src/app/upload
              subPath: immich-library
          env:
            - name: IMMICH_WORKERS_INCLUDE
              value: api
            - name: DB_HOSTNAME
              value: immich-db-rw.immich.svc.cluster.local
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
          envFrom:
            - secretRef:
                name: immich-server-env
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: upload-location
          persistentVolumeClaim:
            claimName: immich-pvc
