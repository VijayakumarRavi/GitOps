---
# immich-machine-learning
kind: Deployment
apiVersion: apps/v1
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app: immich-machine-learning
    app.kubernetes.io/instance: immich-machine-learning
    app.kubernetes.io/name: immich-machine-learning
spec:
  replicas: 2
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 50%
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: immich-machine-learning
              topologyKey: kubernetes.io/hostname
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v1.123.0-openvino
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              gpu.intel.com/i915: '1'
              cpu: 3000m
            requests:
              cpu: 100m
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          env:
            - name: MACHINE_LEARNING_REQUEST_THREADS
              value: '1'
            - name: DB_HOSTNAME
              value: immich-db-rw.immich.svc.cluster.local
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
          ports:
            - containerPort: 3003
              # readinessProbe:
              #   httpGet:
              #     path: /ping
              #     port: 3003
              #   initialDelaySeconds: 30
              #   periodSeconds: 10
              #   timeoutSeconds: 5
              # livenessProbe:
              #   httpGet:
              #     path: /ping
              #     port: 3003
              #   initialDelaySeconds: 30
              #   periodSeconds: 10
              #   timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
---
# Redis
kind: Deployment
apiVersion: apps/v1
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app: immich-redis
    app.kubernetes.io/instance: immich-redis
    app.kubernetes.io/name: immich-redis
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 50%
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: immich-redis
          image: redis:7.4-alpine
          readinessProbe:
            exec:
              command: [redis-cli, ping]
          livenessProbe:
            exec:
              command: [redis-cli, ping]
