apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-vijayakumar-xyz
  namespace: traefik
spec:
  secretName: home-vijayakumar-xyz-tls
  commonName: home-vijayakumar-xyz
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - 'home.vijayakumar.xyz'
    - '*.home.vijayakumar.xyz'
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: '' # Control destination namespaces("" to reflect on all)
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true' # Auto create reflection for matching namespaces
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: '' # Control auto-reflection namespaces("" to reflect on all)
