---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitors-base
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg
  interval: 60m0s
  timeout: 10m0s
  retryInterval: 2m0s
  path: ./kubernetes/home.vijayakumar.xyz/monitors/base/
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  dependsOn:
    - name: monitors-base
  interval: 60m0s
  timeout: 10m0s
  retryInterval: 2m0s
  path: ./kubernetes/home.vijayakumar.xyz/monitors/uptime/
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: flux-system
spec:
  dependsOn:
    - name: uptime-kuma
  interval: 60m0s
  timeout: 10m0s
  retryInterval: 2m0s
  path: ./kubernetes/home.vijayakumar.xyz/monitors/prometheus/
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
