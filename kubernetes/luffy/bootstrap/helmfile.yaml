---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 600
  recreatePods: true
  force: true

repositories:
  - name: cilium
    url: https://helm.cilium.io
  - name: longhorn
    url: https://charts.longhorn.io

releases:
  - name: prometheus-operator-crds
    namespace: monitoring
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 20.0.0

  - name: cilium
    namespace: network
    chart: cilium/cilium
    version: 1.17.3
    values:
      - ../apps/network/cilium/app/values.yaml
    needs:
      - monitoring/prometheus-operator-crds

  - name: coredns
    namespace: network
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.42.1
    values:
      - ../apps/network/coredns/app/values.yaml
    needs:
      - network/cilium

  - name: longhorn
    namespace: storage
    chart: longhorn/longhorn
    version: 1.8.1
    values:
      - ../apps/storage/longhorn/app/values.yaml
    needs:
      - network/coredns

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.20.0
    values:
      - ../apps/flux-system/flux-operator/app/values.yaml
    needs:
      - storage/longhorn

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.20.0
    wait: false
    values:
      - ../apps/flux-system/flux-operator/instance/values.yaml
    needs:
      - flux-system/flux-operator
