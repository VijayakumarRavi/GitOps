---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  timeout: 600
  wait: true
  waitForJobs: true
releases:
  - chart: oci://quay.io/cilium/charts/cilium
    hooks:
      # Wait for Cilium CRDs to be available
      - args:
          - -c
          - until kubectl get crd ciliumloadbalancerippools.cilium.io ciliuml2announcementpolicies.cilium.io &>/dev/null; do sleep 5; done
        command: bash
        events:
          - postsync
        showlogs: true
      # Apply cilium network configuration
      - args:
          - apply
          - --namespace=network
          - --server-side
          - --field-manager=kustomize-controller
          - --kustomize
          - ../../apps/network/cilium/config
        command: kubectl
        events:
          - postsync
        showlogs: true

    name: cilium
    namespace: network
    values:
      - templates/values_luffy.yaml.gotmpl
    version: 1.19.6
  - chart: oci://ghcr.io/coredns/charts/coredns
    name: coredns
    namespace: network
    needs:
      - network/cilium

    values:
      - templates/values_luffy.yaml.gotmpl
    version: 1.47.0
  - chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    name: spegel
    namespace: system
    needs:
      - network/coredns

    values:
      - templates/values_luffy.yaml.gotmpl
    version: 0.7.4
  - chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    name: flux-operator
    namespace: flux-system
    needs:
      - system/spegel

    values:
      - templates/values_luffy.yaml.gotmpl
    version: 0.55.0
  - chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
    values:
      - templates/values_luffy.yaml.gotmpl
    version: 0.55.0
    wait: false
