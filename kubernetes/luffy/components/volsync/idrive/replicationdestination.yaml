---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: ${APP}-bootstrap
spec:
  restic:
    accessModes: ['${VOLSYNC_SNAP_ACCESSMODES:-ReadWriteOnce}']
    cacheAccessModes: ['${VOLSYNC_CACHE_ACCESSMODES:-ReadWriteOnce}']
    cacheCapacity: '${VOLSYNC_CACHE_CAPACITY:-1Gi}'
    cacheStorageClassName: '${VOLSYNC_CACHE_SNAPSHOTCLASS:-miroir-local}'
    capacity: '${VOLSYNC_CAPACITY:-${KOPIUR_CAPACITY:-1Gi}}'
    cleanupCachePVC: true
    cleanupTempPVC: true
    copyMethod: '${VOLSYNC_COPYMETHOD:-Snapshot}'
    enableFileDeletion: true
    moverSecurityContext:
      fsGroup: ${APP_GID:-2000}
      runAsGroup: ${APP_GID:-2000}
      runAsUser: ${APP_UID:-2000}
    repository: '${APP}-volsync-idrive'
    storageClassName: '${VOLSYNC_STORAGECLASS:-miroir-local}'
    volumeSnapshotClassName: '${VOLSYNC_SNAPSHOTCLASS:-miroir-snap}'
  trigger:
    manual: restore-once
