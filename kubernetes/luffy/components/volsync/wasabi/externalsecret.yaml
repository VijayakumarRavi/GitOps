---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-volsync-wasabi"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bao
  target:
    name: "${APP}-volsync-wasabi"
    creationPolicy: Owner
    template:
      data:
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .WASABI_REPOSITORY_TEMPLATE }}/${APP}"
        AWS_ACCESS_KEY_ID: "{{ .WASABI_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .WASABI_AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-template
