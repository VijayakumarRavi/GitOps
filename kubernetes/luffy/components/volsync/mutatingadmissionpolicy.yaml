---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/mutatingadmissionpolicybinding.json
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: volsync-movers-add-nfs
spec:
  policyName: volsync-movers-add-nfs
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/mutatingadmissionpolicy.json
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: volsync-movers-add-nfs
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: >
        object.metadata.name.startsWith("volsync-")
      name: has-volsync-job-name-prefix
    - expression: >
        object.metadata.labels["app.kubernetes.io/created-by"] == "volsync"
      name: has-volsync-created-by-labels
    - expression: >
        !object.spec.template.spec.volumes.exists(item, item.name == "repository")
      name: repository-volume-does-not-exist
  matchConstraints:
    resourceRules:
      - apiGroups: ['batch']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['jobs']
  mutations:
    - jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add", path: "/spec/template/spec/volumes/-",
              value: Object.spec.template.spec.volumes{
                name: "repository",
                nfs: Object.spec.template.spec.volumes.nfs{
                  server: "tank",
                  path: "/mnt/tank/Kubernetes/Backup/Volsync"
                }
              }
            },
            JSONPatch{
              op: "add", path: "/spec/template/spec/containers/0/volumeMounts/-",
              value: Object.spec.template.spec.containers.volumeMounts{
                name: "repository",
                mountPath: "/repository"
              }
            }
          ]
      patchType: 'JSONPatch'
  reinvocationPolicy: IfNeeded
