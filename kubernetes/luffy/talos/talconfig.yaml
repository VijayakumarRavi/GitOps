---
# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
clusterName: &clusterName luffy

endpoint: https://luffy.vjlab.dev:6443

# renovate: depName=siderolabs/talos datasource=github-releases
talosVersion: v1.11.2
# renovate: depName=ghcr.io/siderolabs/kubelet datasource=docker
kubernetesVersion: v1.33.4

additionalApiServerCertSans: &sans
  - luffy.vjlab.dev
  - &talosControlplaneVip 10.0.1.100
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: zoro
    ipAddress: 10.0.1.101
    controlPlane: true
    nodeLabels:
      intel.feature.node.kubernetes.io/gpu: 'true'
    installDiskSelector:
      model: CONSISTENT NVME S6 128GB
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: *talosControlplaneVip
    machineSpec:
      secureboot: true

  - hostname: usopp
    ipAddress: 10.0.1.102
    controlPlane: true
    nodeLabels:
      intel.feature.node.kubernetes.io/gpu: 'true'
    installDiskSelector:
      model: CONSISTENT NVME S6 128GB
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: *talosControlplaneVip
    machineSpec:
      secureboot: true

  - hostname: chopper
    ipAddress: 10.0.1.103
    controlPlane: true
    nodeLabels:
      intel.feature.node.kubernetes.io/gpu: 'true'
    installDiskSelector:
      model: CONSISTENT NVME S6 128GB
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: *talosControlplaneVip
    machineSpec:
      secureboot: true

controlPlane:
  nodeLabels:
    topology.kubernetes.io/region: *clusterName
    topology.kubernetes.io/zone: home

  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/gasket-driver
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/intel-ice-firmware
          - siderolabs/mei

  patches:
    # Configure containerd
    - |-
      machine:
        files:
          - op: create
            path: /etc/cri/conf.d/20-customization.part
            content: |
              [plugins]
                [plugins."io.containerd.grpc.v1.cri"]
                  enable_unprivileged_ports = true
                  enable_unprivileged_icmp = true
              [plugins."io.containerd.grpc.v1.cri".containerd]
                discard_unpacked_layers = false
              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                discard_unpacked_layers = false

    # Disable search domain everywhere
    - |-
      machine:
        network:
          disableSearchDomain: true

    # Enable host dns
    - |-
      machine:
        features:
          hostDNS:
            enabled: true
            resolveMemberNames: true
            forwardKubeDNSToHost: false

    # Mount openebs-hostpath in kubelet
    - |-
      machine:
        kubelet:
          extraMounts:
            - destination: /var/mnt/extra
              type: bind
              source: /var/mnt/extra
              options:
                - rbind
                - rshared
                - rw

    # Configure kubelet
    - |-
      machine:
        kubelet:
          extraConfig:
            maxPods: 150
          nodeIP:
            validSubnets:
                - 10.0.1.0/24

    # Enable MutatingAdmissionPolicy
    - |-
      cluster:
        apiServer:
          extraArgs:
            runtime-config: admissionregistration.k8s.io/v1alpha1=true
            feature-gates: MutatingAdmissionPolicy=true

    # Configure cluster
    - |-
      cluster:
        allowSchedulingOnControlPlanes: true
        coreDNS:
            disabled: true
        proxy:
          disabled: true
        scheduler:
          config:
            apiVersion: kubescheduler.config.k8s.io/v1
            kind: KubeSchedulerConfiguration
            profiles:
              - schedulerName: default-scheduler
                pluginConfig:
                  - name: PodTopologySpread
                    args:
                      defaultingType: List
                      defaultConstraints:
                        - maxSkew: 1
                          topologyKey: kubernetes.io/hostname
                          whenUnsatisfiable: ScheduleAnyway

    # Configure kube-controller-manager metrics
    - |-
      cluster:
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0

    # Configure kube-scheduler metrics
    - |-
      cluster:
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0

    # Configure etcd
    - |-
      cluster:
        etcd:
          advertisedSubnets:
            - 10.0.1.0/24

    # Configure NFS mount options
    - |
      machine:
        files:
          - op: overwrite
            path: /etc/nfsmount.conf
            permissions: 0o644
            content: |
              [ NFSMount_Global_Options ]
              nfsvers=4.2
              hard=True
              noatime=True
              nconnect=16

    # Configure static host entries
    - |-
      machine:
        network:
          extraHostEntries:
            - ip: 10.0.1.100
              aliases:
                - luffy.vjlab.dev
            - ip: 10.0.0.3
              aliases:
                - tank

    # Configure custom sysctls
    - |-
      machine:
        sysctls:
          fs.inotify.max_user_instances: 8192    # Watchdog
          fs.inotify.max_user_watches: 1048576   # Watchdog
          net.core.rmem_max: 67108864            # Cloudflared / QUIC
          net.core.wmem_max: 67108864            # Cloudflared / QUIC

    # Configure udev rules
    - |-
      machine:
        udev:
          rules:
            # Intel GPU
            - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
            # Coral Edge M.2 TPU
            - SUBSYSTEM=="apex", KERNEL=="apex*", GROUP="44", MODE="0660"

    # Disable default API server admission plugins.
    - |-
      - op: remove
        path: /cluster/apiServer/admissionControl

    # Enable K8s Talos API Access
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - actions-runner-system
              - system-upgrade

    # Disk Encryption
    - |-
      machine:
        systemDiskEncryption:
          state:
              provider: luks2
              keys:
                  - slot: 0
                    tpm: {}
          ephemeral:
              provider: luks2
              keys:
                  - slot: 0
                    tpm: {}
