# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: forgejo
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/anubis
  dependsOn:
    - name: kopiur
    - name: external-secrets-stores
    - name: crunchy-postgres-secretstore
    - name: envoy-gateway-config
    - name: dragonfly-cluster
  interval: 30m
  path: "./kubernetes/luffy/apps/dev/forgejo/app"
  postBuild:
    substitute:
      ANUBIS_TARGET: http://forgejo-app.dev.svc.cluster.local:3000
      APP: forgejo
      APP_GID: "1000"
      APP_UID: "1000"
      KOPIUR_CAPACITY: 10Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dev
  timeout: 10m
  wait: false
