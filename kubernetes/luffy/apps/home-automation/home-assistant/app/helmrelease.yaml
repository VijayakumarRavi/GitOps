---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          containers:
            app:
              image:
                repository: ghcr.io/home-assistant/home-assistant
                tag: 2025.4.1
              env:
                VENV_FOLDER: /venv
              resources:
                requests:
                  cpu: 47m
                  memory: 2Gi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: true
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL

    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123

    persistence:
      config:
        existingClaim: home-assistant-config
        advancedMounts:
          home-assistant:
            app:
              - path: /config
      hass-cache:
        existingClaim: hass-cache
        advancedMounts:
          home-assistant:
            app:
              - path: /venv
                subPath: hass-venv
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /tmp
                subPath: hass-tmp

    ingress:
      app:
        enabled: true
        className: nginx
        hosts:
          - host: ha.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
