configuration:
  working_directory: "/workdir/"

presets:
  Youtube Music Mixes:
    audio_extract:
      codec: "m4a"

    download:
      - include_sibling_metadata: true

        url: "{url}"
    embed_thumbnail: true
    match_filters:
      filters:
        - "duration > 600"

    overrides:
      track_album: "{channel}"
      track_file_name: "{upload_date_standardized} - {track_title_sanitized}.{ext}"
      track_total: 0
      track_year: "{playlist_max_upload_year}"

    preset:
      - "_music_base"

