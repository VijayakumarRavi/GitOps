---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            fsGroup: 3001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 3001
            runAsNonRoot: true
            runAsUser: 3001
        containers:
          app:
            image:
              repository: ghcr.io/vijayakumarravi/prowlarr
              tag: 2.5.0.5422
            env:
              COMPlus_EnableDiagnostics: '0'
              PROWLARR__ANALYTICS_ENABLED: 'False'
              PROWLARR__API_KEY:
                valueFrom:
                  secretKeyRef:
                    key: api_key
                    name: prowlarr-secret
              PROWLARR__AUTHENTICATION_METHOD: External
              PROWLARR__INSTANCE_NAME: Prowlarr
              PROWLARR__LOG_LEVEL: info
              PROWLARR__PORT: &port 9696
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 18m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
          flaresolverr:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: false
    persistence:
      config:
        existingClaim: prowlarr-config
      add-ons:
        type: emptyDir
      tmp:
        type: emptyDir
      media:
        type: nfs
        path: /mnt/tank/Media
        server: tank
        globalMounts:
          - path: /data/nas-media
    route:
      app:
        hostnames:
          - prowlarr.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: *port
