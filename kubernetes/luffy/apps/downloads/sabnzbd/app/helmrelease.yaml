---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          securityContext:
            fsGroup: 3001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 3001
            runAsNonRoot: true
            runAsUser: 3001
        containers:
          app:
            image:
              repository: ghcr.io/vijayakumarravi/sabnzbd
              tag: 5.0.4
            env:
              SABNZBD__API_KEY:
                valueFrom:
                  secretKeyRef:
                    key: api_key
                    name: sabnzbd-secret
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd, sabnzbd.downloads, sabnzbd.downloads.svc, sabnzbd.downloads.svc.cluster,
                sabnzbd.downloads.svc.cluster.local, sabnzbd.${CLUSTER_DOMAIN}
              SABNZBD__NZB_KEY:
                valueFrom:
                  secretKeyRef:
                    key: nzb_key
                    name: sabnzbd-secret
              SABNZBD__PORT: &port 8080
              XSEED_APIKEY:
                valueFrom:
                  secretKeyRef:
                    key: xseed_api_key
                    name: sabnzbd-secret
              XSEED_HOST: cross-seed.downloads.svc.cluster.local
              XSEED_PORT: 2468
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 5m
                memory: 1Gi
              limits:
                memory: 12Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
    persistence:
      config:
        existingClaim: sabnzbd-config
        advancedMounts:
          sabnzbd:
            app:
              - path: /config
      downloads:
        type: nfs
        path: /mnt/tank/Media
        server: tank
        globalMounts:
          - path: /data/nas-media/
      temp:
        type: emptyDir
        advancedMounts:
          sabnzbd:
            app:
              - path: /tmp
      scripts:
        type: configMap
        defaultMode: 0775
        name: sabnzbd-scripts
        advancedMounts:
          sabnzbd:
            app:
              - path: /config/scripts
    route:
      app:
        hostnames:
          - sabnzbd.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: *port
