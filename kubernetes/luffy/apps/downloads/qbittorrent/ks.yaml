# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname qbittorrent
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components: [../../../../components/volsync]
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
  interval: 30m
  path: ./kubernetes/luffy/apps/downloads/qbittorrent/app
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CLAIM: qbittorrent-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: downloads
  timeout: 10m
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname qui
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components: [../../../../components/volsync]
  dependsOn:
    - name: qbittorrent
  interval: 30m
  path: ./kubernetes/luffy/apps/downloads/qbittorrent/qui
  postBuild:
    substitute:
      APP: *appname
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: downloads
  timeout: 10m
  wait: false
