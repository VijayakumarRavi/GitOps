---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname radarr
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/kopiur
    - ../../../../components/volsync
  dependsOn:
    - name: external-secrets-stores
    - name: kopiur
    - name: kopiur-repository
    - name: volsync
  interval: 30m
  path: "./kubernetes/luffy/apps/downloads/radarr/app"
  postBuild:
    substitute:
      APP: *appname
      APP_GID: "2000"
      APP_UID: "2000"
      KOPIUR_CLAIM: radarr-config
      VOLSYNC_CLAIM: radarr-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: downloads
  timeout: 10m
  wait: false
