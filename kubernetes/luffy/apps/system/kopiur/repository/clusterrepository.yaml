---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: idrive-e2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-idrive-e2-secret
          namespace: system
      bucket: vjlab-kopiur
      endpoint: l4g4.ch11.idrivee2-2.com
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-idrive-e2-secret
      namespace: system
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
