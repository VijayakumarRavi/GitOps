---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
    namespace: flux-system
  interval: 30m
  values:
    fullnameOverride: renovate-operator
    route:
      enabled: true
      hostnames:
        - renovate.${CLUSTER_DOMAIN}
      parentRefs:
        - name: envoy
          namespace: network
    webhook:
      enabled: true
#    config:
#      # -- whether to delete successfully finished renovate jobs (will lose logs)
#      deleteSuccessfulJobs: true
#      # -- TTL for finished renovate jobs in seconds, -1 means they are kept forever
#      jobTTLSecondsAfterFinished: 60
