---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      bitwarden:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          bitwarden:
            image:
              repository: ghcr.io/lucadev/bw-cli
              tag: 2025.4.0@sha256:b8f1b3f155f32b2a9215c9fc70c619410b8c3f97ef496541fd34d6dbe89bf854
            envFrom:
              - secretRef:
                  name: bitwarden-secret
            resources:
              requests:
                memory: 150Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 1024m
            probes:
              liveness:
                enabled: true
                spec:
                  exec:
                    command:
                      - curl
                      - --data
                      - ""
                      - --fail
                      - http://127.0.0.1:8087/sync?force=true
                  initialDelaySeconds: 20
                  failureThreshold: 3
                  timeoutSeconds: 10
                  periodSeconds: 120
              readiness:
                enabled: true
                spec:
                  exec:
                    command:
                      - /opt/healthcheck.sh
                  initialDelaySeconds: 20
                  failureThreshold: 3
                  timeoutSeconds: 1
                  periodSeconds: 10
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: 8087
                  initialDelaySeconds: 15
                  failureThreshold: 30
                  timeoutSeconds: 1
                  periodSeconds: 5
    service:
      app:
        controller: bitwarden
        ports:
          http:
            port: 8087

    persistence:
      data:
        globalMounts:
          - path: "/home/bitwarden/.config/Bitwarden CLI/"
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 500m
