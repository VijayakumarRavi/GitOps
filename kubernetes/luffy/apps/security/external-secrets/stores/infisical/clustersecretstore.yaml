---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            key: clientId
            namespace: security
            name: infisical-auth-credentials
          clientSecret:
            key: clientSecret
            namespace: security
            name: infisical-auth-credentials
      secretsScope:
        projectSlug: luffy-1re-z
        environmentSlug: prod
        secretsPath: /kube
        recursive: true
