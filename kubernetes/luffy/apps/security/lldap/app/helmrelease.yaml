---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      lldap:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542
        containers:
          app:
            image:
              repository: lldap/lldap
              tag: v0.6.2-alpine-rootless
            envFrom:
              - secretRef:
                  name: lldap-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 250Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    service:
      web:
        controller: lldap
        ports:
          http:
            port: 17170
      lldap:
        controller: lldap
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.1.5
        ports:
          ldap:
            port: 3890

    ingress:
      web:
        enabled: true
        className: nginx
        hosts:
          - host: lldap.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: web
                  port: http

    persistence:
      data:
        type: emptyDir
