# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-auto-languages
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
  values:
    controllers:
      plex-auto-languages:
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - plex
                  topologyKey: kubernetes.io/hostname
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

            runAsGroup: 568
            runAsUser: 568
        containers:
          app:
            image:
              repository: remirigal/plex-auto-languages
              tag: master@sha256:8b5f008ad63cf4fe8126b1afff8681615990c2c183f37d21d156abfc3905dcea
            env:
              PLEX_URL: http://plex.media.svc.cluster.local:32400
            envFrom:
              - secretRef:
                  name: plex-auto-languages
            resources:
              requests:
                cpu: 50m
                memory: 128M
              limits:
                memory: 1024M

    persistence:
      config:
        enabled: true
        type: emptyDir
      local:
        type: emptyDir
        globalMounts:
          - path: /.local
    service:
      main:
        enabled: false
