---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname plex
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/kopiur
    - ../../../../components/volsync
  dependsOn:
    - name: external-secrets-stores
    - name: kopiur
    - name: kopiur-repository
    - name: volsync
  interval: 30m
  path: './kubernetes/luffy/apps/media/plex/app'
  postBuild:
    substitute:
      APP: *appname
      KOPIUR_CAPACITY: 50Gi
      KOPIUR_CLAIM: plex-config
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_CLAIM: plex-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 10m
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname plex-trakt-sync
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/kopiur
    - ../../../../components/volsync
  dependsOn:
    - name: external-secrets-stores
    - name: kopiur
    - name: kopiur-repository
    - name: plex
    - name: volsync
  interval: 30m
  path: './kubernetes/luffy/apps/media/plex/trakt-sync'
  postBuild:
    substitute:
      APP: *appname
      APP_GID: '1000'
      APP_UID: '1000'
      KOPIUR_CLAIM: plex-trakt-sync-config
      VOLSYNC_CLAIM: plex-trakt-sync-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 10m
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
