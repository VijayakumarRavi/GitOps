---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
  values:
    controllers:
      tracearr:
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: 1.4.23@sha256:30936647e202f36e61e57bb461cee172b8b04caeee9f666f1865ab797389e108
            env:
              TZ: Asia/Kolkata
              LOG_LEVEL: info
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/4
              CORS_ORIGIN: "https://tracearr.${CLUSTER_DOMAIN}"
              HOST: "0.0.0.0"
              NODE_ENV: production
              PORT: &port 3000
            envFrom:
              - secretRef:
                  name: tracearr-secret
              - secretRef:
                  name: tracearr-db
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: tracearr
        ports:
          http:
            port: *port

    route:
        app:
          hostnames:
            - tracearr.${CLUSTER_DOMAIN}
          parentRefs:
            - name: envoy
              namespace: network
