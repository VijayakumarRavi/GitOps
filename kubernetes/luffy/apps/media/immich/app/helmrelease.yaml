---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v1.126.1
            env:
              IMMICH_WORKERS_INCLUDE: api
              IMMICH_CONFIG_FILE: &configfile /config/immich.config.json
            envFrom:
              - secretRef:
                  name: immich-env
            probes: &probes
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources: &resources
              requests:
                cpu: 200m
              limits:
                gpu.intel.com/i915: "1"
                cpu: 3000m
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 3
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v1.126.1
            env:
              IMMICH_WORKERS_EXCLUDE: api
              IMMICH_CONFIG_FILE: *configfile
            envFrom:
              - secretRef:
                  name: immich-env
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources: *resources
      machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 3
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v1.126.1-openvino
            env:
              MACHINE_LEARNING_REQUEST_THREADS: "1"
              IMMICH_CONFIG_FILE: *configfile
            envFrom:
              - secretRef:
                  name: immich-env
            probes: *probes
            resources: *resources
    service:
      server:
        controller: server
        ports:
          http:
            port: 2283
      worker:
        controller: worker
        ports:
          http:
            port: 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
    ingress:
      app:
        className: nginx
        hosts:
          - host: immich.home.vijayakumar.xyz
            paths:
              - path: /
                service:
                  identifier: server
                  port: http
    persistence:
      model-cache:
        existingClaim: model-cache-pvc
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
      config:
        enabled: true
        type: secret
        name: immich-config-secret
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: tank.home.vijayakumar.xyz
        path: /mnt/tank/Kubernetes/immich
        globalMounts:
          - path: /usr/src/app/upload
