---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - files:
      - ./config/immich.config.json
    name: immich-config-tpl
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./externalsecret.yaml
  - ./funnel.yaml
  - ./server/helmrelease.yaml
  - ./worker/helmrelease.yaml
  - ./machine-learning/helmrelease.yaml
  - ./machine-learning/pvc.yaml
