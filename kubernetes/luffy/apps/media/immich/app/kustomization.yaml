---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./server/helmrelease.yaml
  - ./worker/helmrelease.yaml
  - ./machine-learning/helmrelease.yaml
  - ./machine-learning/pvc.yaml
configMapGenerator:
  - name: immich-config-tpl
    files:
      - ./config/immich.config.json
generatorOptions:
  disableNameSuffixHash: true
