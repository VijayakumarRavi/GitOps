apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-funnel
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/proxy-class: "luffy-ts-proxy"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: immich-server
      port:
        name: http
  tls:
    - hosts:
        - immich
