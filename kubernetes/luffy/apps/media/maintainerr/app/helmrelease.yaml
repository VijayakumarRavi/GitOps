---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
  values:
    controllers:
      maintainerr:
        forceRename: maintainerr
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
            k8tz.io/inject: 'false'
        containers:
          maintainerr:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.2.0
            env:
              - name: TZ
                value: 'Asia/Kolkata'
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi
          overlay-helperr:
            image:
              repository: gsariev/maintainerr-overlay-helperr
              tag: latest@sha256:253f6b8b31dcc446de588fffa38f323f1cafe0643912d5bc59bcc955af28ea3d
            env:
              - name: TZ
                value: 'Asia/Kolkata'
            envFrom:
              - secretRef:
                  name: maintainerr-overlay-helperr
            resources:
              requests:
                cpu: 50m
                memory: 128M
              limits:
                memory: 1024M
    service:
      app:
        controller: maintainerr
        ports:
          http:
            port: 6246
    route:
        app:
          hostnames:
            - maintainerr.${CLUSTER_DOMAIN}
          parentRefs:
            - name: envoy
              namespace: network

    persistence:
      data:
        existingClaim: maintainerr-data
        globalMounts:
          - path: /opt/data
