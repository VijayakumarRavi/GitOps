# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
  values:
    controllers:
      maintainerr:
        pod:
          annotations:
            k8tz.io/inject: 'false'
            reloader.stakater.com/auto: "true"
        forceRename: maintainerr
        containers:
          maintainerr:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.12.1
            env:
              - name: TZ
                value: 'Asia/Kolkata'
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi
          overlay-helperr:
            image:
              repository: gsariev/maintainerr-overlay-helperr
              tag: latest@sha256:49151bff9094e89f5a19ece8e2e53f00da59b8a53aa69be90f3702b7ed39ed2e
            env:
              - name: TZ
                value: 'Asia/Kolkata'
            envFrom:
              - secretRef:
                  name: maintainerr-overlay-helperr
            resources:
              requests:
                cpu: 50m
                memory: 128M
              limits:
                memory: 1024M
    persistence:
      data:
        existingClaim: maintainerr-data
        globalMounts:
          - path: /opt/data
    route:
      app:
        hostnames:
          - maintainerr.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network

    service:
      app:
        controller: maintainerr
        ports:
          http:
            port: 6246
