---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname maintainerr
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: kopiur
    - name: plex
  interval: 30m
  path: './kubernetes/luffy/apps/media/maintainerr/app'
  postBuild:
    substitute:
      APP: *appname
      APP_GID: '1000'
      APP_UID: '1000'
      KOPIUR_CLAIM: maintainerr-data
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 10m
  wait: false
