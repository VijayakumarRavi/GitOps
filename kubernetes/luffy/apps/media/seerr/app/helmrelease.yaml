# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  dependsOn:
    - name: plex
      namespace: media
  values:
    controllers:
      seerr:
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

            runAsGroup: 2000
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.2.0
            env:
              LOG_LEVEL: debug
              PORT: &port 5055
              TZ: Asia/Kolkata
            envFrom:
              - secretRef:
                  name: seerr-db
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/v1/settings/public
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi

    persistence:
      config:
        existingClaim: seerr-config
        globalMounts:
          - path: /app/config

    route:
      app:
        hostnames:
          - seerr.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network

    service:
      app:
        controller: seerr
        ports:
          http:
            port: *port
