---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invidious
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.2
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  values:
    controllers:
      invidious:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: quay.io/invidious/invidious
              tag: 2024.09.20-a021b93
            envFrom:
              - secretRef:
                  name: invidious-secret
              - secretRef:
                  name: invidious-db-secret
            env:
              INVIDIOUS_ADMINS: "[vijay]"
              INVIDIOUS_CHANNEL_THREADS: 2
              INVIDIOUS_CHECK_TABLES: true
              INVIDIOUS_DOMAIN: &hostname invidious.${CLUSTER_DOMAIN}
              INVIDIOUS_EXTERNAL_PORT: 443
              INVIDIOUS_FULL_REFRESH: false
              INVIDIOUS_HTTPS_ONLY: true
              INVIDIOUS_PORT: &port 3000
              INVIDIOUS_REGISTRATION_ENABLED: false
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: invidious
        ports:
          http:
            port: *port

    ingress:
      app:
        className: nginx
        hosts:
          - host: *hostname
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
