apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-funnel
  namespace: media
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/proxy-class: "luffy-ts-proxy"
spec:
  defaultBackend:
    service:
      name: jellyfin
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
        - jellyfin
