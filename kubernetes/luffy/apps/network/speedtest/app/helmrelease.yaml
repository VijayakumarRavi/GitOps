---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  interval: 30m
  values:
    controllers:
      speedtest:
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/speedtest-tracker
              tag: 1.14.3@sha256:c3750c40948a9360000ce62d694da92e85584b4ab6d3d9a9d1432d76fa5e0726
            env:
              APP_TIMEZONE: 'Asia/Kolkata'
              APP_URL: 'https://speedtest.${CLUSTER_DOMAIN}'
              ASSET_URL: 'https://speedtest.${CLUSTER_DOMAIN}'
              DISPLAY_TIMEZONE: 'Asia/Kolkata'
              PGID: '1000'
              PRUNE_RESULTS_OLDER_THAN: '90'
              PUBLIC_DASHBOARD: 'true'
              PUID: '1000'
              SPEEDTEST_SCHEDULE: '6 * * * *'
            envFrom:
              - secretRef:
                  name: speedtest-secret
              - secretRef:
                  name: speedtest-db
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/healthcheck
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
              readiness: *probes
              startup:
                enabled: false
    persistence:
      config:
        existingClaim: speedtest-config
        globalMounts:
          - path: /config
    route:
      app:
        hostnames:
          - speedtest.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network
    service:
      app:
        controller: speedtest
        ports:
          http:
            port: 80
