---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-pihole
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      pihole:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          pihole:
            image:
              repository: docker.io/tjouve/external-dns
              tag: 6a4d8474@sha256:fb3d1c299b79024bdbec8c3648785160e42b8ca5c586520ccdd3ff26771f57b8
            env:
              - name: EXTERNAL_DNS_PIHOLE_SERVER
                value: http://10.0.2.1
            envFrom:
              - secretRef:
                  name: external-dns-pihole
            args:
              - --events
              - --source=service
              - --registry=noop
              - --log-format=text
              - --log-level=debug
              - --source=ingress
              - --policy=upsert-only
              - --interval=5m
              - --provider=pihole
              - --pihole-api-version=6
              - --metrics-address=:7979
              - --ignore-ingress-tls-spec
              - --crd-source-kind=DNSEndpoint
              - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7979
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
    serviceAccount:
      create: true
      name: *app
    service:
      pihole:
        controller: pihole
        ports:
          http:
            port: *port
    serviceMonitor:
      pihole:
        serviceName: external-dns-pihole
        enabled: true
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
