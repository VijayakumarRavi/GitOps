---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  dependsOn:
    - name: nginx
  interval: 60m0s
  timeout: 30m0s
  retryInterval: 2m0s
  path: ./kubernetes/luffy/apps/storage/longhorn/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: home-ops
