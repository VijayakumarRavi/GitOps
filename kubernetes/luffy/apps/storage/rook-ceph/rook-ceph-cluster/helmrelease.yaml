---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chart:
    spec:
      chart: rook-ceph-cluster
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
      version: v1.20.0
  dependsOn:
    - name: rook-ceph
      namespace: storage
  interval: 30m
  values:
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          allowVolumeExpansion: true
          enabled: true
          isDefault: true # change me
          name: ceph-block
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: storage
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: storage
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: storage
            imageFeatures: layering
            imageFormat: '2'
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      deletionPolicy: Delete
      enabled: true
      isDefault: false
      name: csi-ceph-blockpool
    cephClusterSpec:
      cephConfig:
        global:
          bdev_async_discard_threads: '1' # quote
          bdev_enable_discard: 'true' # quote
          bluestore_slow_ops_warn_lifetime: '600'
          bluestore_slow_ops_warn_threshold: '3'
          device_failure_prediction_mode: local # requires mgr module
          osd_class_update_on_start: 'false' # quote
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        prometheusEndpoint: http://prometheus-operated.monitoring.svc.cluster.local:9090
        ssl: false
        urlPrefix: /
      mgr:
        modules:
          - enabled: true
            name: pg_autoscaler
      network:
        connections:
          requireMsgr2: true
        provider: host
      resources:
        mgr:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        mgr-sidecar:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        mon:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 512Mi
        osd:
          limits:
            memory: 6Gi
          requests:
            cpu: 500m
            memory: 2Gi
      storage:
        config:
          osdsPerDevice: '1'
        deviceFilter: sda
        useAllDevices: false
        useAllNodes: true
    cephFileSystemVolumeSnapshotClass:
      deletionPolicy: Delete
      enabled: true
      isDefault: false
      name: csi-ceph-filesystem
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          dataPools:
            - failureDomain: host
              name: data0
              replicated:
                size: 3
          metadataPool:
            replicated:
              size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              limits:
                memory: 3Gi
              requests:
                cpu: 100m
                memory: 1Gi
        storageClass:
          allowVolumeExpansion: true
          enabled: true
          isDefault: false
          mountOptions:
            - ms_mode=secure
          name: ceph-filesystem
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: storage
            csi.storage.k8s.io/fstype: ext4
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: storage
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: storage
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephObjectStores: []
    monitoring:
      createPrometheusRules: true
      enabled: true
    operatorNamespace: storage
    route:
      dashboard:
        host:
          name: rook.${CLUSTER_DOMAIN}
          path: '/'
          pathType: PathPrefix
        parentRefs:
          - name: envoy
            namespace: network
    toolbox:
      enabled: true
