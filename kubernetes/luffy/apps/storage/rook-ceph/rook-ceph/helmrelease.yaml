---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chart:
    spec:
      chart: rook-ceph
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
      version: v1.20.7
  interval: 30m
  releaseName: rook-ceph
  values:
    crds:
      enabled: true
    csi:
      serviceMonitor:
        enabled: false # liveness metrics require Driver.spec.liveness (not yet in ceph-csi-drivers chart v1.0.1)
    enableDiscoveryDaemon: true
    monitoring:
      enabled: true
    resources:
      limits: {}
      requests:
        cpu: 100m
        memory: 128Mi
