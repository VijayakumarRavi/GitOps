# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chart:
    spec:
      chart: openebs
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      version: 4.4.0
  interval: 30m
  values:
    alloy:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      hostpathClass:
        basePath: &hostPath /var/mnt/extra/openebs/local
        enabled: true
        isDefaultClass: false
        name: openebs-hostpath
      localpv:
        basePath: *hostPath
        image:
          registry: quay.io/
          repository: openebs/provisioner-localpv
      rbac:
        create: true
    loki:
      enabled: false
    lvm-localpv:
      enabled: false

    mayastor:
      enabled: false

    minio:
      enabled: false

    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false

    zfs-localpv:
      enabled: false

