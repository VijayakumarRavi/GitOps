---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bao
  target:
    name: karakeep-secret
    template:
      data:
        NEXTAUTH_SECRET: "{{ .karakeep_nextauth_secret }}"
        MEILI_MASTER_KEY: "{{ .karakeep_meilisearch_master_key }}"
        OAUTH_WELLKNOWN_URL: "{{ .karakeep_oauth_wellknown_url }}"
        OAUTH_CLIENT_SECRET: "{{ .karakeep_oauth_client_secret }}"
        OAUTH_CLIENT_ID: "{{ .karakeep_oauth_client_id }}"
        OAUTH_PROVIDER_NAME: "Pocket-ID"
        OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
  dataFrom:
    - extract:
        key: karakeep
      rewrite:
        - regexp:
            source: "(.*)"
            target: "karakeep_$1"
