---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          paperless:
            dependsOn:
              - gotenberg
              - tika
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 2.20.6
            env:
              # Configure application
              PAPERLESS_URL: https://paperless.${CLUSTER_DOMAIN}
              PAPERLESS_PORT: '8000'
              PAPERLESS_TIME_ZONE: 'Asia/Kolkata'
              PAPERLESS_WEBSERVER_WORKERS: '2'
              PAPERLESS_TASK_WORKERS: '2'
              # Configure folders
              PAPERLESS_DATA_DIR: /data/config
              PAPERLESS_MEDIA_ROOT: /data/nas/media
              PAPERLESS_EXPORT_DIR: /data/nas/export
              PAPERLESS_CONSUMPTION_DIR: /data/nas/incoming
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: '60'
              PAPERLESS_CONSUMER_RECURSIVE: 'true'
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: 'true'
              # Configure OCR
              PAPERLESS_OCR_LANGUAGES: eng tam tel hin kan mal
              PAPERLESS_OCR_LANGUAGE: eng+tam+tel+hin+kan+mal
              # Configure redis integration
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local:6379/3
              # Enable optional support for Office
              PAPERLESS_TIKA_ENABLED: 1
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
            envFrom:
              - secretRef:
                  name: paperless-secret
              - secretRef:
                  name: paperless-db
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
                memory: 2Gi
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.260
            # The gotenberg chromium route is used to convert .eml files. We do not
            # want to allow external content like tracking pixels or even javascript.
            command:
              - 'gotenberg'
              - '--chromium-disable-javascript=true'
              - '--chromium-allow-list=file:///tmp/.*'
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.2.3.0
    service:
      paperless:
        controller: paperless
        ports:
          http:
            port: 8000

    route:
        app:
          hostnames:
            - paperless.${CLUSTER_DOMAIN}
          parentRefs:
            - name: envoy
              namespace: network

    persistence:
      data:
        existingClaim: paperless-data
        advancedMounts:
          paperless:
            app:
              - path: /data/config
      nas:
        type: nfs
        server: tank
        path: /mnt/tank/Kubernetes/Apps/paperless
        globalMounts:
          - path: /data/nas
