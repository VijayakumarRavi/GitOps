---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      vaultwarden:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: "RollingUpdate"
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        containers:
          app:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.33.2
            envFrom:
              - configMapRef:
                  name: vaultwarden-env
              - secretRef:
                  name: vaultwarden-db
              - secretRef:
                  name: vaultwarden-secrets
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 200m
    service:
      vaultwarden:
        controller: vaultwarden
        ports:
          http:
            port: 8080
    ingress:
      app:
        className: nginx
        hosts:
          - host: vault.home.vijayakumar.xyz
            paths:
              - path: /
                service:
                  identifier: vaultwarden
                  port: http
    persistence:
      config:
        existingClaim: vaultwarden-config
        globalMounts:
          - path: /data
