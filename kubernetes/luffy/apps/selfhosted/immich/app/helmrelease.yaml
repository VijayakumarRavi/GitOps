---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      immich-server:
        annotations:
          reloader.stakater.com/auto: 'true'
        replicas: 2
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v1.124.2
            env:
              IMMICH_WORKERS_INCLUDE: api
            envFrom:
              - secretRef:
                  name: immich-env
            probes: &probes
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources: &resources
              requests:
                cpu: 200m
              limits:
                gpu.intel.com/i915: '1'
                cpu: 3000m
      immich-worker:
        annotations:
          reloader.stakater.com/auto: 'true'
        replicas: 3
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v1.124.2
            env:
              IMMICH_WORKERS_EXCLUDE: api
            envFrom:
              - secretRef:
                  name: immich-env
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources: *resources
      immich-machine-learning:
        annotations:
          reloader.stakater.com/auto: 'true'
        replicas: 3
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v1.124.2-openvino
            env:
              MACHINE_LEARNING_REQUEST_THREADS: '1'
            envFrom:
              - secretRef:
                  name: immich-env
            probes: *probes
            resources: *resources
      immich-redis:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: redis
              tag: 7.4-alpine
            probes: *probes
            resources: *resources
    service:
      immich-server:
        controller: immich-server
        ports:
          http:
            port: 2283
      immich-worker:
        controller: immich-worker
        ports:
          http:
            port: 2283
      immich-machine-learning:
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
      immich-redis:
        controller: immich-redis
        ports:
          http:
            port: 6379
    ingress:
      app:
        className: traefik
        hosts:
          - host: immich.home.vijayakumar.xyz
            paths:
              - path: /
                service:
                  identifier: immich-server
                  port: http
    persistence:
      model-cache:
        type: emptyDir
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /cache
          immich-redis:
            app:
              - path: /data
      media:
        type: nfs
        server: 10.0.0.3
        path: /mnt/tank/Kubernetes/immich
        globalMounts:
          - path: /usr/src/app/upload
