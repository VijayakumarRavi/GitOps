---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname freshrss
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/kopiur
    - ../../../../components/volsync
  dependsOn:
    - name: external-secrets-stores
    - name: kopiur
    - name: kopiur-repository
    - name: volsync
  interval: 30m
  path: "./kubernetes/luffy/apps/selfhosted/freshrss/app"
  postBuild:
    substitute:
      APP: *appname
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_CLAIM: freshrss
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_CLAIM: freshrss
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 10m
  wait: false
