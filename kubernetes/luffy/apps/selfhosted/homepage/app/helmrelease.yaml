---
#$schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 30m
  chart:
    spec:
      chart: homepage
      version: 2.0.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: flux-system
  values:
    controller:
      homepage:
        annotations:
          confimap.reloader.stakater.com/reload: homepage-configs
          secret.reloader.stakater.com/reload: homepage-env
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v0.10.9
    serviceAccount:
      create: true
      name: homepage
    enableRbac: true
    ingress:
      app:
        enabled: true
        annotations:
          nginx.ingress.kubernetes.io/auth-url: |-
            http://ak-outpost-authentik-embedded-outpost.security.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
          nginx.ingress.kubernetes.io/auth-signin: |-
            https://dash.luffy.vijayakumar.xyz/outpost.goauthentik.io/start?rd=$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-response-headers: |-
            Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
        ingressClassName: nginx
        hosts:
          - host: dash.luffy.vijayakumar.xyz
            paths:
              - path: /
                pathType: Prefix
    config:
      useExistingConfigMap: homepage-configs
    envFrom:
      - secretRef:
          name: homepage-env
