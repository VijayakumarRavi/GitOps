---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hoarder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hoarder-secret
    template:
      data:
        NEXTAUTH_SECRET: "{{ .hoarder_nextauth_secret }}"
        MEILI_MASTER_KEY: "{{ .hoarder_meilisearch_master_key }}"
        OAUTH_PROVIDER_NAME: "Auth0"
        OAUTH_WELLKNOWN_URL: "{{ .hoarder_oauth_client_wellknown_url }}"
        OAUTH_CLIENT_ID: "{{ .hoarder_oauth_client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .hoarder_oauth_client_secret }}"
  dataFrom:
    - extract:
        key: Hoarder
      rewrite:
        - regexp:
            source: "(.*)"
            target: "hoarder_$1"
