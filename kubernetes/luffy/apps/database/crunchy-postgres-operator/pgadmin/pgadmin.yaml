---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PGAdmin
metadata:
  name: pgadmin
  namespace: database
spec:
  users:
    - username: im@vijayakumar.xyz
      role: Administrator
      passwordRef:
        name: pgadmin-password
        key: pgadmin-password
  dataVolumeClaimSpec:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 1Gi
  serverGroups:
    - name: supply
      postgresClusterSelector: {}
