---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: &name crunchy-postgres
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: crunchy-postgres-secret
    template:
      data:
        s3.conf: |
          [global]
          repo2-s3-key={{ .crunchy_postgres_backblaze_cpgo_access_id }}
          repo2-s3-key-secret={{ .crunchy_postgres_backblaze_cpgo_access_key }}
        encryption.conf: |
          [global]
          repo1-cipher-pass={{ .crunchy_postgres_backup_encryption_cipher }}
          repo2-cipher-pass={{ .crunchy_postgres_backup_encryption_cipher }}
  dataFrom:
    - extract:
        key: Crunchy postgres
      rewrite:
        - regexp:
            source: "(.*)"
            target: "crunchy_postgres_$1"
