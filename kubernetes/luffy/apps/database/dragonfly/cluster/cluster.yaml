---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  replicas: 1
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys

  networkPolicyEnabled: false

  serviceSpec:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: 10.0.1.3
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 512Mi
