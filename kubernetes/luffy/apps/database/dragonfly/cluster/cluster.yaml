apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys

  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          divisor: 1Mi
          resource: limits.memory
  networkPolicyEnabled: false

  replicas: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
  serviceSpec:
    annotations:
      lbipam.cilium.io/ips: 10.0.1.3
    type: LoadBalancer
