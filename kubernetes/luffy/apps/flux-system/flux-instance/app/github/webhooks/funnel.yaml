apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-webhook-receiver-funnel
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/proxy-class: "luffy-ts-proxy"
spec:
  ingressClassName: tailscale
  rules:
    - host: flux-webhook
      http:
        paths:
          - backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
            path: /hook/
            pathType: Prefix
  tls:
    - hosts:
        - flux-webhook
