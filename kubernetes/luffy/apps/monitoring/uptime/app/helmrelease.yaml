---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      uptime:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542 # gladius:external-services
        containers:
          uptime:
            image:
              repository: louislam/uptime-kuma
              tag: 1.23.16
            ports:
              - name: http
                containerPort: 3001
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

    service:
      uptime:
        controller: uptime
        ports:
          http:
            port: 3001

    ingress:
      uptime:
        className: nginx
        hosts:
          - host: uptime.${CLUSTER_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: uptime
                  port: http

    persistence:
      config:
        existingClaim: uptime-config
        globalMounts:
          - path: /app/data
