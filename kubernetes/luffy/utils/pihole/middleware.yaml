---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect
  namespace: utils
spec:
  redirectRegex:
    regex: /admin/$
    replacement: /
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-prefix
  namespace: utils
spec:
  addPrefix:
    prefix: /admin
