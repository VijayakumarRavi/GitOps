---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./kubernetes/robin/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cluster-meta
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - kind: Secret
                name: cluster-secrets
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2beta1
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          timeout: 10m
          install:
            createNamespace: true
            crds: CreateReplace
            remediation:
              retries: 5
          upgrade:
            crds: CreateReplace
            cleanupOnFail: true
            remediation:
              strategy: rollback
              retries: 5
          uninstall:
            keepHistory: false
      target:
        kind: HelmRelease
        group: helm.toolkit.fluxcd.io
        labelSelector: helmdefault.flux.home.arpa/disabled notin (true)
