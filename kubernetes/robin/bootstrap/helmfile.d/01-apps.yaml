---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true

  force: true
  recreatePods: true
  timeout: 600
  wait: true
  waitForJobs: true
releases:
  - chart: oci://ghcr.io/coredns/charts/coredns
    name: coredns
    namespace: network
    values:
      - templates/values_base.yaml.gotmpl

    version: 1.45.2
  - chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    name: flux-operator
    namespace: flux-system
    needs:
      - network/coredns

    values:
      - templates/values_robin.yaml.gotmpl
    version: 0.50.0
  - chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
    values:
      - templates/values_robin.yaml.gotmpl
    version: 0.50.0
    wait: false
