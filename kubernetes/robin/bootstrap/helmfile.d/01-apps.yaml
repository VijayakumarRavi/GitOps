---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  timeout: 600
  wait: true
  waitForJobs: true
releases:
  - chart: oci://quay.io/cilium/charts/cilium
    hooks:
      # Wait for Cilium CRDs before applying pool config
      - args:
          - -c
          - until kubectl get crd ciliumloadbalancerippools.cilium.io &>/dev/null; do sleep 5; done
        command: bash
        events:
          - postsync
        showlogs: true
      # Apply IPv6 LB pool via postsync hook (same pattern as luffy)
      - args:
          - apply
          - --namespace=network
          - --server-side
          - --field-manager=kustomize-controller
          - --kustomize
          - ../../apps/network/cilium/config
        command: kubectl
        events:
          - postsync
        showlogs: true
    name: cilium
    namespace: network
    values:
      - templates/values_robin.yaml.gotmpl
    version: 1.19.5
  - chart: oci://ghcr.io/coredns/charts/coredns
    name: coredns
    namespace: network
    needs:
      - network/cilium
    values:
      - templates/values_robin.yaml.gotmpl
    version: 1.46.1
  - chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    name: flux-operator
    namespace: flux-system
    needs:
      - network/coredns
    values:
      - templates/values_robin.yaml.gotmpl
    version: 0.55.0
  - chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
    values:
      - templates/values_robin.yaml.gotmpl
    version: 0.55.0
    wait: false
