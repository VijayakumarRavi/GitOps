---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  wait: true
  force: true
  timeout: 600
  waitForJobs: true
  recreatePods: true
  cleanupOnFail: true

releases:
  - name: coredns
    namespace: network
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.45.2
    values:
      - templates/values_base.yaml.gotmpl

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.33.0
    values:
      - templates/values_robin.yaml.gotmpl
    needs:
      - network/coredns

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.33.0
    wait: false
    values:
      - templates/values_robin.yaml.gotmpl
    needs:
      - flux-system/flux-operator
