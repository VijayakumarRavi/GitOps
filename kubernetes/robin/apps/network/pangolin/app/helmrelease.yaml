# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pangolin
spec:
  chartRef:
    kind: OCIRepository
    name: pangolin
    namespace: flux-system

  interval: 30m
  timeout: 1m
  values:
    cnpg-cluster:
      enabled: false

    cnpg-operator:
      enabled: false
    database:
      connection:
        existingSecretKey: uri

        existingSecretName: pangolin-db-secret
      mode: external
    deployment:
      mode: single

      type: controller
    gerbil:
      enabled: true
      persistence:
        enabled: true

    namespace:
      create: false

    pangolin:
      config:
        app:
          dashboard_url: "https://pangolin.${LAB_DOMAIN}"
          log_level: info
        gerbil:
          # REPLACE: set to the hostname/IP where external WireGuard peers reach Gerbil.
          base_endpoint: "vpn.${LAB_DOMAIN}"

      replicaCount: 1
    traefik:
      config:
        dynamicRouters:
          host: "pangolin.${LAB_DOMAIN}"
        letsencryptEmail: "admin@${LAB_DOMAIN}"
      enabled: true
      persistence:
        enabled: true
