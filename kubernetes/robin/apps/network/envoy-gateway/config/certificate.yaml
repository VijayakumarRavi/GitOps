---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${CLUSTER_DOMAIN}
spec:
  secretName: ${CLUSTER_DOMAIN}-https-tls
  issuerRef:
    name: zerossl-production
    kind: ClusterIssuer
  commonName: "*.${CLUSTER_DOMAIN}"
  dnsNames: ["*.${CLUSTER_DOMAIN}"]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${LAB_DOMAIN}
spec:
  secretName: ${LAB_DOMAIN}-tls
  issuerRef:
    name: zerossl-production
    kind: ClusterIssuer
  commonName: "*.${LAB_DOMAIN}"
  dnsNames: ["*.${LAB_DOMAIN}"]

