apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${CLUSTER_DOMAIN}
spec:
  commonName: "*.${CLUSTER_DOMAIN}"
  dnsNames: ["*.${CLUSTER_DOMAIN}"]
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-production
  secretName: ${CLUSTER_DOMAIN}-https-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${LAB_DOMAIN}
spec:
  commonName: "*.${LAB_DOMAIN}"
  dnsNames: ["*.${LAB_DOMAIN}"]
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-production
  secretName: ${LAB_DOMAIN}-tls

