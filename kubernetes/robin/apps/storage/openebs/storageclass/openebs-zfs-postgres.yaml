kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: openebs-zfs-postgres
provisioner: zfs.csi.openebs.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  poolname: "openebs-pool"
  fstype: "zfs"
  dedup: "off"
  recordsize: "16k"
  compression: "lz4"
  primarycache: "all"
