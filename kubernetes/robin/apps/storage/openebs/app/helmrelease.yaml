---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: 4.4.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  values:
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
          keep: true

    localpv-provisioner:
      enabled: false
      #rbac:
      #  create: true
      #localpv:
      #  image:
      #    registry: quay.io/
      #    repository: openebs/provisioner-localpv
      #  basePath: &hostPath /var/mnt/extra/openebs/local
      hostpathClass:
        enabled: false
      #  name: openebs-hostpath
      #  isDefaultClass: false
      #  basePath: *hostPath

    lvm-localpv:
      enabled: true

    zfs-localpv:
      enabled: false

    mayastor:
      enabled: false

    engines:
      local:
        lvm:
          enabled: true
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    loki:
      enabled: false

    alloy:
      enabled: false

    minio:
      enabled: false
