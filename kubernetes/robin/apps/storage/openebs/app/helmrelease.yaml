---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chart:
    spec:
      chart: openebs
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
      version: 4.5.0
  interval: 30m
  values:
    alloy:
      enabled: false

    engines:
      local:
        lvm:
          enabled: true
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    localpv-provisioner:
      enabled: false
      # rbac:
      #  create: true
      # localpv:
      #  image:
      #    registry: quay.io/
      #    repository: openebs/provisioner-localpv
      #  basePath: &hostPath /var/mnt/extra/openebs/local
      hostpathClass:
        enabled: false
    #  name: openebs-hostpath
    #  isDefaultClass: false
    #  basePath: *hostPath

    loki:
      enabled: false

    lvm-localpv:
      enabled: true

    mayastor:
      enabled: false

    minio:
      enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
          keep: true

    zfs-localpv:
      enabled: false
