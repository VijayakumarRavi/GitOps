---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgres-operator.crunchydata.com/postgrescluster_v1beta1.json
apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: &name postgres
  annotations:
    postgres-operator.crunchydata.com/pgbackrest-ip-version: IPv6
spec:
  backups:
    pgbackrest:
      configuration: &backupConfig
        - secret:
            name: crunchy-postgres-secret
      global: &backupFlag
        archive-async: "y"
        archive-push-queue-max: 1GiB
        compress-level: "9"
        # R2
        compress-type: bz2
        repo1-block: "y"
        repo1-bundle: "y"
        repo1-path: /crunchy-pgo/robin
        repo1-retention-full: "7" # days
        repo1-retention-full-type: time
        repo1-s3-uri-style: path
      manual:
        options: [--type=full]
        repoName: repo1
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-backup
      repos:
        - name: repo1 # R2
          s3: &r2
            bucket: "backup"
            endpoint: ${R2_ENDPOINT}
            region: "us-east-1"
          schedules:
            differential: "0 1 * * 1-6" # Mon-Sat at 01:00
            full: "0 1 * * 0" # Sunday at 01:00
            incremental: "0 2-23 * * *" # Every hour except 01:00
  dataSource:
    pgbackrest:
      configuration: *backupConfig
      global: *backupFlag
      repo:
        name: "repo1"
        s3: *r2
      stanza: "db"
  instances:
    - dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi

        storageClassName: openebs
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres
      name: postgres
      replicas: &replica 1
  metadata:
    labels:
      crunchy-userinit.drummyfloyd.github.com/enabled: "true"
      crunchy-userinit.drummyfloyd.github.com/superuser: vijay
  monitoring:
    pgmonitor:
      exporter:
        resources:
          limits:
            memory: 512M
          requests:
            cpu: 10m
            memory: 64M
  patroni:
    dynamicConfiguration:
      postgresql:
        max_wal_size: 1GB
        parameters:
          listen_addresses: "*"
          autovacuum_analyze_scale_factor: "0.02"

          # Small latency win
          autovacuum_naptime: "10s"
          autovacuum_vacuum_scale_factor: "0.05"
          checkpoint_completion_target: "0.9"
          effective_cache_size: "3GB"
          maintenance_work_mem: "256MB"
          max_connections: "100"

          # WAL & checkpoint tuning
          max_wal_size: "4GB"
          min_wal_size: "1GB"
          random_page_cost: "1.1"
          shared_buffers: "1GB"
          wal_compression: "on"

          # Autovacuum tuning
          work_mem: "16MB"
        pg_hba:
          - hostssl all all all scram-sha-256
        synchronous_commit: "on"
  postgresVersion: 18
  proxy:
    pgBouncer:
      config:
        global:
          client_tls_sslmode: prefer
          pool_mode: transaction # pgBouncer is set to transaction for Authentik. Grafana requires session https://github.com/grafana/grafana/issues/74260#issuecomment-1702795311. Everything else is happy with transaction
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-pgbouncer
      port: 5432
      replicas: *replica
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: *name
              postgres-operator.crunchydata.com/role: pgbouncer
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
  service:
    type: ClusterIP
  #  type: NodePort
  #  nodePort: 32629
  users:
    # Superuser
    - databases: [postgres]
      name: vijay
      options: SUPERUSER
    # Applications
    - databases: [pocketid]
      name: pocketid
      password:
        type: AlphaNumeric
    - databases: [lldap]
      name: lldap
      password:
        type: AlphaNumeric
    - databases: [ente]
      name: ente
      password:
        type: AlphaNumeric
    - databases: [forgejo]
      name: forgejo
      password:
        type: AlphaNumeric
    - databases: [gotosocial]
      name: gotosocial
      password:
        type: AlphaNumeric
