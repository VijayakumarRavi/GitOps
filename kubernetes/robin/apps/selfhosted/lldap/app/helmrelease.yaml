---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  interval: 30m
  timeout: 1m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      lldap:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
          surge: 1
        containers:
          app:
            image:
              repository: ghcr.io/lldap/lldap
              tag: 2025-12-24-alpine-rootless
            env:
              LLDAP_LDAPS_OPTIONS__ENABLED: true
              LLDAP_LDAPS_OPTIONS__CERT_FILE: /certs/tls.crt
              LLDAP_LDAPS_OPTIONS__KEY_FILE: /certs/tls.key
            envFrom:
              - secretRef:
                  name: lldap-secret
              - secretRef:
                  name: lldap-db-secret
            probes:
              liveness: &healthcheck
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /app/lldap
                      - healthcheck
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *healthcheck
            resources:
              requests:
                cpu: 20m
                memory: 250Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    service:
      web:
        controller: lldap
        ports:
          http:
            port: &port 17170
      lldap:
        controller: lldap
        type: NodePort
        ports:
          ldap:
            port: 6360
            nodePort: 32621

    route:
      app:
        hostnames:
          - lldap.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network
        rules:
          - backendRefs:
              - identifier: web
                port: *port

    persistence:
      certs:
        enabled: true
        type: secret
        name: ${CLUSTER_DOMAIN}-lldaps-tls
