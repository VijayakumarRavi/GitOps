---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocketid
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      pocketid:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.7.0-distroless
            env:
              ACCENT_COLOR: "#0089E9"
              ANALYTICS_DISABLED: "true"
              APP_URL: https://auth.${CLUSTER_DOMAIN}
              EMAIL_API_KEY_EXPIRATION_ENABLED: "true"
              EMAIL_LOGIN_NOTIFICATION_ENABLED: "true"
              EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "true"
              EMAIL_VERIFICATION_ENABLED: "true"
              FILE_BACKEND: "database"
              LDAP_ADMIN_GROUP_NAME: "lldap_admin"
              LDAP_ATTRIBUTE_GROUP_MEMBER: "member"
              LDAP_ATTRIBUTE_GROUP_NAME: "cn"
              LDAP_ATTRIBUTE_GROUP_UNIQUE_IDENTIFIER: "uuid"
              LDAP_ATTRIBUTE_USER_EMAIL: "mail"
              LDAP_ATTRIBUTE_USER_FIRST_NAME: "first_name"
              LDAP_ATTRIBUTE_USER_LAST_NAME: "last_name"
              LDAP_ATTRIBUTE_USER_PROFILE_PICTURE: "avatar"
              LDAP_ATTRIBUTE_USER_UNIQUE_IDENTIFIER: "uuid"
              LDAP_ATTRIBUTE_USER_USERNAME: "user_id"
              LDAP_ENABLED: "true"
              LDAP_SKIP_CERT_VERIFY: "true"
              LDAP_SOFT_DELETE_USERS: "true"
              LDAP_URL: "ldaps://lldap.selfhosted.svc:6360"
              PGID: "1000"
              PORT: &port 1411
              PUID: "1000"
              SESSION_DURATION: "1440"
              SMTP_PORT: "587"
              SMTP_TLS: "starttls"
              TRUST_PROXY: "true"
              UI_CONFIG_DISABLED: "true"
            envFrom:
              - secretRef:
                  name: pocketid-secret
              - secretRef:
                  name: pocketid-db-secret
            probes:
              liveness: &healthcheck
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /app/pocket-id
                      - healthcheck
                  failureThreshold: 3
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *healthcheck
            resources:
              requests:
                cpu: 12m
                memory: 128M

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data

    route:
      app:
        hostnames:
          - auth.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network

    service:
      app:
        controller: pocketid
        ports:
          http:
            port: *port
  timeout: 1m
