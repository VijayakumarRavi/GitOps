---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ente
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      ente:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          server:
            image:
              repository: ghcr.io/ente-io/server
              tag: latest@sha256:6a1a76df708c29affb833cf2a89f1b4b318f58f15e64cb0249e76cd8cd1df304
            env:
              - name: HOST
                value: "::"
              - name: ENTE_HTTP_HOST
                value: "::"
            envFrom:
              - secretRef:
                  name: ente-secret
              - secretRef:
                  name: ente-db-secret
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
          web:
            image:
              repository: ghcr.io/ente-io/web
              tag: latest@sha256:51c6c801093aedd899f68ee40b70fc2dadf423ae0e15b5b3764e40c84c2b9766
            env:
              - name: HOST
                value: "::"
              - name: HOSTNAME
                value: "::"
            envFrom:
              - secretRef:
                  name: ente-secret
              - secretRef:
                  name: ente-db-secret
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
    route:
      photos: &route
        hostnames:
          - photos.${CLUSTER_DOMAIN}

        parentRefs: &id001
          - name: envoy
            namespace: network
        rules:
          - backendRefs:
              - identifier: photos
                port: http
      api:
        <<: *route
        hostnames:
          - ente.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: api
                port: http

      accounts:
        <<: *route
        hostnames:
          - accounts.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: accounts
                port: http

      public-albums:
        <<: *route
        hostnames:
          - albums.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: public-albums
                port: http

      cast:
        <<: *route
        hostnames:
          - cast.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: cast
                port: http

      share:
        <<: *route
        hostnames:
          - share.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: share
                port: http

      embed:
        <<: *route
        hostnames:
          - embed.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: embed
                port: http

      auth:
        <<: *route
        hostnames:
          - ente-auth.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: auth
                port: http

      paste:
        <<: *route
        hostnames:
          - paste.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: paste
                port: http

      locker:
        <<: *route
        hostnames:
          - locker.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: locker
                port: http

      memories:
        <<: *route
        hostnames:
          - memories.${CLUSTER_DOMAIN}
        parentRefs: *id001
        rules:
          - backendRefs:
              - identifier: memories
                port: http

    persistence:
      nginx-conf:
        enabled: true
        type: configMap
        name: nginx-conf
        advancedMounts:
          ente:
            web:
              - path: /etc/nginx/conf.d/default.conf
                subPath: nginx.conf
    service:
      api:
        controller: ente
        ports:
          http:
            port: 8080
      photos:
        controller: ente
        ports:
          http:
            port: 3000
      accounts:
        controller: ente
        ports:
          http:
            port: 3001
      public-albums:
        controller: ente
        ports:
          http:
            port: 3002
      cast:
        controller: ente
        ports:
          http:
            port: 3004
      share:
        controller: ente
        ports:
          http:
            port: 3005
      embed:
        controller: ente
        ports:
          http:
            port: 3006
      auth:
        controller: ente
        ports:
          http:
            port: 3003
      paste:
        controller: ente
        ports:
          http:
            port: 3008
      locker:
        controller: ente
        ports:
          http:
            port: 3009
      memories:
        controller: ente
        ports:
          http:
            port: 3010
  timeout: 1m
