---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ente-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bao
  target:
    name: ente-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Key & JWT
        ENTE_KEY_ENCRYPTION: "{{ .ente_encryption_key }}"
        ENTE_KEY_HASH: "{{ .ente_encryption_hash }}"
        ENTE_JWT_SECRET: "{{ .ente_jwt_secret }}"

        # Internal
        ENTE_INTERNAL_ADMIN: "1580559962386438"

        # S3
        ENTE_S3_ARE_LOCAL_BUCKETS: "false"
        ENTE_S3_USE_PATH_STYLE_URLS: "true"
        ENTE_S3_B2_EU_CEN_KEY: "{{ .ente_iDrive_key }}"
        ENTE_S3_B2_EU_CEN_SECRET: "{{ .ente_iDrive_secret }}"
        ENTE_S3_B2_EU_CEN_ENDPOINT: "{{ .ente_iDrive_endpoint }}"
        ENTE_S3_B2_EU_CEN_REGION: "us-west-1"
        ENTE_S3_B2_EU_CEN_BUCKET: "ente"

        # SMTP
        ENTE_SMTP_HOST: "{{ .ente_smtp_host }}"
        ENTE_SMTP_PORT: "587"
        ENTE_SMTP_USERNAME: "{{ .ente_smtp_username }}"
        ENTE_SMTP_PASSWORD: "{{ .ente_smtp_password }}"
        ENTE_SMTP_EMAIL: "{{ .ente_smtp_username }}"
        ENTE_SMTP_SENDER_NAME: "Ente"
        ENTE_SMTP_ENCRYPTION: "ssl"
        # Apps
        ENTE_APPS_ACCOUNTS: "http://localhost:3001"
        ENTE_APPS_PUBLIC_ALBUMS: "http://localhost:3002"
        ENTE_APPS_CAST: "http://localhost:3004"
        ENTE_APPS_PUBLIC_LOCKER: "http://localhost:3005"
        ENTE_APPS_EMBED_ALBUMS: "http://localhost:3006"
        ENTE_APPS_CUSTOM_DOMAIN_CNAME: "${CLUSTER_DOMAIN}"
  dataFrom:
    - extract:
        key: ente
      rewrite:
        - regexp:
            source: "(.*)"
            target: "ente_$1"

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ente-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: ente-db-secret
    template:
      type: Opaque
      data:
        ENTE_DB_HOST:  "{{ .host }}"
        ENTE_DB_PORT: "{{ .port }}"
        ENTE_DB_NAME:  "{{ .dbname }}"
        ENTE_DB_USER: "{{ .user }}"
        ENTE_DB_SSLMODE: "require"
        ENTE_DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: postgres-pguser-ente
