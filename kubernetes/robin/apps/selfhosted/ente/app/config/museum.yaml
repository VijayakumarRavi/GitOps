key:
    encryption: {{ .ente_encryption_key }}
    hash: {{ .ente_encryption_hash }}
jwt:
    secret: {{ .ente_jwt_secret }}

internal:
  admin: 1580559962386438

s3:
    are_local_buckets: false
    use_path_style_urls: true
    b2-eu-cen:
      key: {{ .ente_iDrive_key }}
      secret: {{ .ente_iDrive_secret }}
      endpoint: {{ .ente_iDrive_endpoint }}
      region: us-west-1
      bucket: ente

smtp:
    host: {{ .ente_smtp_host }}
    port: 587
    username: {{ .ente_smtp_username }}
    password: {{ .ente_smtp_password }}
    email: {{ .ente_smtp_username }}
    sender-name: Ente
    encryption: ssl

webauthn:
  rpid: ${CLUSTER_DOMAIN}
  rporigins:
    - https://ente.${CLUSTER_DOMAIN}
    - https://photos.${CLUSTER_DOMAIN}
    - https://accounts.${CLUSTER_DOMAIN}
    - https://albums.${CLUSTER_DOMAIN}
    - https://cast.${CLUSTER_DOMAIN}
    - https://share.${CLUSTER_DOMAIN}

apps:
    accounts: http://localhost:3001
    public-albums: http://localhost:3002
    cast: http://localhost:3004
    public-locker: http://localhost:3005
    embed-albums: http://localhost:3006
    custom-domain:
        cname: ${CLUSTER_DOMAIN}
