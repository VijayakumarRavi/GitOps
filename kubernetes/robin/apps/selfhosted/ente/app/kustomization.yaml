---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - files:
      - ./config/museum.yaml
    name: museum-tpl
  - files:
      - ./config/nginx.conf
    name: nginx-conf
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./helmrelease.yaml
  - ./externalsecret.yaml
