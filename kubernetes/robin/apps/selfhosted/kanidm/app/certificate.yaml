apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${LAB_DOMAIN}
spec:
  commonName: "*.${LAB_DOMAIN}"
  dnsNames: ["*.${LAB_DOMAIN}"]
  duration: 160h
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-production
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  secretName: ${LAB_DOMAIN}-tls
  usages:
    - digital signature
