---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${LAB_DOMAIN}
spec:
  secretName: ${LAB_DOMAIN}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.${LAB_DOMAIN}"
  dnsNames: ["*.${LAB_DOMAIN}"]
  duration: 160h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
