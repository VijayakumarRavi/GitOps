---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kanidm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      kanidm:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        replicas: 1
        containers:
          mail-sender:
            image:
              repository: docker.io/kanidm/tools
              tag: 1.10.3
            command: ["/sbin/kanidm-mail-sender", "-c", "/mail/client-config", "-m", "/mail/mail_sender.toml"]
            probes:
              liveness: &healthcheck
                enabled: false
              readiness: *healthcheck
            resources:
              requests:
                cpu: 20m
                memory: 250Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
          server:
            image:
              repository: docker.io/kanidm/server
              tag: 1.10.3
            env:
              KANIDM_ADMIN_BIND_PATH: /var/run/kanidmd.sock
              KANIDM_CONFIG: /config/server.toml
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
    persistence:
      certs:
        type: secret
        defaultMode: 0400
        name: ${LAB_DOMAIN}-tls
        globalMounts:
          - path: /certs
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /var/run
            subPath: var-run
          - path: /cache
      config:
        type: configMap
        defaultMode: 0400

        name: kanidm-server-config
      mail:
        type: secret
        defaultMode: 0400
        name: kanidm-mail-sender
        globalMounts:
          - path: /mail/mail_sender.toml
            readOnly: true
            subPath: mail_sender.toml
          - path: /mail/client-config
            readOnly: true

            subPath: client-config
      data:
        existingClaim: kanidm
        globalMounts:
          - path: /data
            subPath: data
    route:
      server:
        hostnames:
          - idm.${LAB_DOMAIN}
        parentRefs:
          - name: envoy
            namespace: network
        rules:
          - backendRefs:
              - identifier: web
                port: &port 8443
    service:
      web:
        controller: kanidm
        ports:
          http:
            port: *port
      kanidm:
        type: NodePort
        controller: kanidm
        ports:
          ldap:
            nodePort: 32626

            port: 3636
  timeout: 1m
