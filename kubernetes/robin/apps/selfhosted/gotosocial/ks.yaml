---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname gotosocial
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: volsync
    - name: envoy-gateway-config
    - name: external-secrets-stores
    - name: crunchy-postgres-secretstore
  interval: 30m
  path: "./kubernetes/robin/apps/selfhosted/gotosocial/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 10m
  wait: true
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CAPACITY: 10Gi
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phanpy
  namespace: flux-system
spec:
  dependsOn:
    - name: gotosocial
  interval: 1h
  path: "./kubernetes/robin/apps/selfhosted/gotosocial/phanpy"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
