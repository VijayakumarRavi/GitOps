---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      forgejo:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          app:
            image:
              repository: codeberg.org/forgejo/forgejo
              tag: 15.0.2-rootless
            env:
              FORGEJO____APP_NAME: "Forgejo"
              FORGEJO__actions__DEFAULT_URL: "https://github.com"
              FORGEJO__actions__ENABLED: true
              FORGEJO__cache__ADAPTER: redis
              FORGEJO__cache__ENABLED: true
              FORGEJO__cache__HOST: &redis redis://forgejo-redis:6379
              FORGEJO__queue__CONN_STR: *redis
              FORGEJO__queue__TYPE: redis
              FORGEJO__server__ROOT_URL: "https://git.${CLUSTER_DOMAIN}"
              FORGEJO__server__SSH_DOMAIN: "git.${CLUSTER_DOMAIN}"
              FORGEJO__server__SSH_LISTEN_PORT: "2222"
              FORGEJO__server__SSH_PORT: "22"
              FORGEJO__session__PROVIDER: redis
              FORGEJO__session__PROVIDER_CONFIG: *redis
            envFrom:
              - secretRef:
                  name: forgejo-secret
              - secretRef:
                  name: forgejo-db-secret
            resources:
              requests:
                cpu: 12m
                memory: 128M
              limits:
                memory: 2G

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      data:
        existingClaim: forgejo
        advancedMounts:
          forgejo:
            app:
              - path: /var/lib/gitea
                subPath: data
              - path: /etc/gitea
                subPath: config
    route:
      ssh:
        kind: TCPRoute
        parentRefs:
          - name: envoy
            namespace: network
            sectionName: ssh
        rules:
          - backendRefs:
              - name: forgejo-ssh
                port: 22

    service:
      app:
        controller: forgejo
        ports:
          http:
            port: 3000
      ssh:
        type: ClusterIP
        # externalIPs:
        #   - ${NODE_IP}
        controller: forgejo
        ports:
          ssh:
            port: 22
            targetPort: 2222
  timeout: 1m
