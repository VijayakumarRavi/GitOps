apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook-receiver
spec:
  hostnames:
    - flux-webhook.${CLUSTER_DOMAIN}
  parentRefs:
    - name: envoy
      namespace: network
  rules:
    - backendRefs:
        - name: webhook-receiver
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /hook/
