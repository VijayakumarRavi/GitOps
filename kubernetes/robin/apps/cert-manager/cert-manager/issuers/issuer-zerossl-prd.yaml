---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl-production
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    email: ${LE_EMAIL}
    privateKeySecretRef:
      name: zerossl-production
    externalAccountBinding:
      keyID: ekO4i4QIJK2KdZXtoKObjg
      keySecretRef:
        name: zerossl-eabsecret
        key: eabsecret
      keyAlgorithm: HS256
    solvers:
      - dns01:
          cloudflare:
            email: ${LE_EMAIL}
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - ${CLUSTER_DOMAIN}
            - ${LAB_DOMAIN}
