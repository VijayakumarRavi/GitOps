---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${KOPIUR_CLAIM:-${APP}}
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=openebs-hostpath}
    securityContext:
      runAsGroup: ${KOPIUR_PGID:-${APP_GID:-2000}}
      runAsUser: ${KOPIUR_PUID:-${APP_UID:-2000}}
  repository:
    kind: ClusterRepository
    name: idrive-e2
  retention:
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepWeekly: 4
  sources:
    - pvc:
        name: ${KOPIUR_CLAIM:-${APP}}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
