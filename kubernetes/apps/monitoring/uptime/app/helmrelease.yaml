---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      uptime:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542 # gladius:external-services
        containers:
          uptime:
            image:
              repository: ghcr.io/louislam/uptime-kuma
              tag: beta-rootless@sha256:278b1c70a55c6cb2d3de8009f8001f67f0120836e79d05f1cae632a77e1c77e1
            ports:
              - name: http
                containerPort: 3001
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

    service:
      uptime:
        controller: uptime
        ports:
          http:
            port: 3001

    route:
        app:
          hostnames:
            - uptime.${CLUSTER_DOMAIN}
          parentRefs:
            - name: envoy
              namespace: network

    persistence:
      config:
        existingClaim: uptime-config
        globalMounts:
          - path: /app/data
