---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
    namespace: flux-system
  interval: 30m
  values:
    fullnameOverride: victoria-logs
    retentionPeriod: 14d
    server:
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      serviceMonitor:
        enabled: true
      ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - name: logs.${CLUSTER_DOMAIN}
            path:
              - /
            port: http
    dashboards:
      enabled: true
      annotations:
        grafana_folder: logs
      labels:
        grafana_dashboard: "1"
