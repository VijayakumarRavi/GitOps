---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-machine-learning
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - immich-machine-learning
              topologyKey: 'kubernetes.io/hostname'
    controllers:
      immich-machine-learning:
        annotations:
          reloader.stakater.com/auto: 'true'
        replicas: 2
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.2.1-openvino
            env:
              IMMICH_CONFIG_FILE: /config/immich.config.json
            envFrom:
              - secretRef:
                  name: immich-env
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 200m
              limits:
                gpu.intel.com/i915: '1'
                cpu: 3000m
    service:
      immich-machine-learning:
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
    persistence:
      model-cache:
        existingClaim: model-cache-pvc
        globalMounts:
          - path: /cache
          - path: /.cache
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      config:
        enabled: true
        type: secret
        name: immich-config-secret
        globalMounts:
          - path: /config
          - path: /.config
      media:
        type: nfs
        server: tank
        path: /mnt/tank/Kubernetes/Apps/immich
        globalMounts:
          - path: /usr/src/app/upload
