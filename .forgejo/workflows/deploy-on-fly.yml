---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Fly.io Apps on Dependency Updates
"on":
  push:
    paths: [fly.io/**]
    branches: ['master']

jobs:
  deploy-fly-app:
    runs-on: ubuntu-latest
    # if: >
    #   github.event.commits[0].author.name == 'renovate[bot]' ||
    #   github.event.commits[0].author.email == 'bot@renovateapp.com'
    strategy:
      matrix:
        app: [authfly, baovault, gotifyfly, vaultfly]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Install Flyctl
        uses: https://github.com/superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Determine Modified Files
        id: changes
        run: |
          echo "Modified Files:"
          git diff --name-only HEAD~1 HEAD

          if git diff --name-only HEAD~1 HEAD | grep -q "^fly.io/${{ matrix.app }}/"; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy ${{ matrix.app }}
        if: steps.changes.outputs.modified == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |-
          echo "Deploying ${{ matrix.app }} to Fly.io..."
          flyctl -a ${{ matrix.app }} deploy --remote-only --now --no-public-ips --strategy immediate --no-cache fly.io/${{ matrix.app }}/
