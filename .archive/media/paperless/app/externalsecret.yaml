---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-secret
spec:
  dataFrom:
    - extract:
        key: paperless
      rewrite:
        - regexp:
            source: "(.*)"
            target: "paperless_$1"
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bao
  target:
    creationPolicy: Owner
    name: *name
    template:
      data:
        PAPERLESS_ACCOUNT_SESSION_REMEMBER: "true"
        PAPERLESS_ADMIN_PASSWORD: "{{ .paperless_admin_password }}"
        PAPERLESS_ADMIN_USER: "{{ .paperless_admin_username }}"
        PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
        PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
        PAPERLESS_EMAIL_HOST: "{{ .paperless_smtp_host }}"
        PAPERLESS_EMAIL_HOST_PASSWORD: "{{ .paperless_smtp_password }}"
        PAPERLESS_EMAIL_HOST_USER: "{{ .paperless_smtp_user }}"
        PAPERLESS_EMAIL_PORT: "{{ .paperless_smtp_port }}"
        PAPERLESS_EMAIL_USE_TLS: "true"
        PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
        PAPERLESS_SECRET_KEY: "{{ .paperless_config_secret_key }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "SCOPE": [
                "openid",
                "profile",
                "email"
              ],
              "OAUTH_PKCE_ENABLED": true,
              "APPS": [
                {
                  "provider_id": "pocket-id",
                  "name": "Pocket-ID",
                  "client_id": "{{ .paperless_pocketid_client_id }}",
                  "secret": "{{ .paperless_pocketid_client_secret }}",
                  "settings": {
                    "server_url": "{{ .paperless_pocketid_server_url }}"
                  }
                }
              ]
            }
          }
        PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-db
spec:
  dataFrom:
    - extract:
        key: postgres-pguser-paperless
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-pgo-secrets
  target:
    name: *name
    template:
      data:
        PAPERLESS_DBENGINE: "postgresql"
        PAPERLESS_DBHOST: "{{ .host }}"
        PAPERLESS_DBNAME: "{{ .dbname }}"
        PAPERLESS_DBPASS: "{{ .password }}"
        PAPERLESS_DBPORT: "{{ .port }}"
        PAPERLESS_DBUSER: "{{ .user }}"
      type: Opaque
